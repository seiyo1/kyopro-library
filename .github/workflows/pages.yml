name: pages

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile headers
        run: g++ -std=c++17 -Wall -Wextra -pedantic tests/compile.cpp -o /tmp/compile-test && /tmp/compile-test

      - name: Test expander
        run: python3 tools/expand.py tests/compile.cpp -o /tmp/expanded.cpp && g++ -std=c++17 -Wall -Wextra -pedantic /tmp/expanded.cpp -o /tmp/expanded-test && /tmp/expanded-test

      - name: Build docs
        run: mkdocs build --strict

      - name: Upload pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
